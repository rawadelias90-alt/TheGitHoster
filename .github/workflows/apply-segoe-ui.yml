name: Apply Segoe UI font update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-segoe-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update global UI font
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('agent-api-masterclass/styles.css')
          text = p.read_text(encoding='utf-8')
          old = "--font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;"
          new = "--font-ui: 'Segoe UI', Tahoma, Arial, sans-serif;"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old UI font token, found {text.count(old)}')
          text = text.replace(old, new)
          if "--font-code: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;" not in text:
              raise SystemExit('Code font stack changed unexpectedly')
          if "html[lang='ar'] body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }" not in text:
              raise SystemExit('Arabic Segoe UI rule missing')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate project
        shell: bash
        run: |
          cd agent-api-masterclass
          node --check app.js
          node tests/smoke.js
          grep -Fq -- "--font-ui: 'Segoe UI', Tahoma, Arial, sans-serif;" styles.css
          grep -Fq -- "--font-code: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;" styles.css
          grep -Fq -- "html[lang='ar'] body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }" styles.css
          ! grep -Fq -- "--font-ui: -apple-system, BlinkMacSystemFont" styles.css

      - name: Commit clean project change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent-api-masterclass/styles.css
          git rm .github/workflows/apply-segoe-ui.yml
          git diff --cached --quiet && exit 1 || true
          git commit -m 'Use Segoe UI across Agent API Masterclass'
          git push origin HEAD:main
