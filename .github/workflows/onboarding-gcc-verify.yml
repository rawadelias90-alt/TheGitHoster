name: GCC onboarding verification
on:
  push:
    branches: [feature/gcc-national-onboarding]
    paths:
      - 'onboarding-guide-v2/**'
      - '.github/workflows/onboarding-gcc-verify.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test environment
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Business rule suite
        run: node --test onboarding-guide-v2/tests/*.test.mjs
      - name: Existing UI regression
        run: python onboarding-guide-v2/tests/ui_test.py
      - name: GCC UI regression
        run: python onboarding-guide-v2/tests/gcc_ui_test.py
      - name: Brand font desktop mobile print regression
        run: python onboarding-guide-v2/tests/font_render_test.py
