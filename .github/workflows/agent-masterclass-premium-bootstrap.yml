name: Apply Agent Masterclass Premium Patch

on:
  push:
    branches: [main]
    paths:
      - '.agent-masterclass-transfer/**'
      - '.github/workflows/agent-masterclass-premium-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct, validate, and apply project update
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, glob, gzip
          from pathlib import Path
          parts = sorted(glob.glob('.agent-masterclass-transfer/*.b85'))
          encoded = ''.join(Path(p).read_text() for p in parts)
          patch = gzip.decompress(base64.b85decode(encoded.encode()))
          Path('/tmp/agent-masterclass-premium.patch').write_bytes(patch)
          PY
          git apply --check /tmp/agent-masterclass-premium.patch
          git apply /tmp/agent-masterclass-premium.patch
          node --check agent-api-masterclass/app.js
          node agent-api-masterclass/tests/smoke.js
          rm -rf .agent-masterclass-transfer
          rm -f .github/workflows/agent-masterclass-premium-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Upgrade Agent API Masterclass learning experience"
          git push origin HEAD:main
