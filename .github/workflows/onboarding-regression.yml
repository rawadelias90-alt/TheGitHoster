name: Onboarding guide regression

on:
  pull_request:
    paths:
      - 'onboarding-guide-v2/**'
      - '.github/workflows/onboarding-regression.yml'
  push:
    branches: [main, design/gro-site-refresh]
    paths:
      - 'onboarding-guide-v2/**'
      - '.github/workflows/onboarding-regression.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install guide test dependencies
        run: npm ci --prefix onboarding-guide-v2 --no-audit --no-fund
      - name: Install browser runner
        run: |
          python -m pip install playwright pypdf
          python -m playwright install --with-deps chromium
      - name: Business rules, typography and interaction state
        run: node --test onboarding-guide-v2/tests/*.test.mjs
      - name: Live selection summary UI
        run: python onboarding-guide-v2/tests/selection_summary_ui_test.py
      - name: Existing guide UI
        run: python onboarding-guide-v2/tests/ui_test.py
      - name: GCC UI and contract sequence
        run: python onboarding-guide-v2/tests/gcc_ui_test.py
      - name: Catalogue UI
        run: python onboarding-guide-v2/tests/catalogue_ui_test.py
      - name: Font rendering
        run: python onboarding-guide-v2/tests/font_render_test.py
      - name: V2 interaction, responsive and print checks
        run: python onboarding-guide-v2/tests/refresh_ui_test.py
      - name: Build static guide
        run: npm run build --prefix onboarding-guide-v2
      - name: Save V2 review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-v2-review-captures
          path: ${{ runner.temp }}/guide-v2-qa
          if-no-files-found: ignore
