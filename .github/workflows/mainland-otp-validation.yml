name: Mainland OTP validation
on:
  push:
    branches: [feature/mainland-mohre-two-otp-checkpoints]
    paths:
      - onboarding-guide-v2/**
      - .github/workflows/mainland-otp-validation.yml
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser runner
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Business rules
        run: node --test onboarding-guide-v2/tests/*.test.mjs
      - name: Existing guide UI
        run: python onboarding-guide-v2/tests/ui_test.py
      - name: GCC UI
        run: python onboarding-guide-v2/tests/gcc_ui_test.py
      - name: Catalogue UI
        run: python onboarding-guide-v2/tests/catalogue_ui_test.py
      - name: Font rendering
        run: python onboarding-guide-v2/tests/font_render_test.py
