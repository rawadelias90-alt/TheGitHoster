name: Single-screen wizard development
on:
  push:
    branches: [feature/guide-single-question-screens]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: New single-screen wizard browser test
        run: python onboarding-guide-v2/tests/single_screen_ui_test.py
      - name: Business rules
        run: node --test onboarding-guide-v2/tests/*.test.mjs
      - name: Existing guided and result UI
        run: python onboarding-guide-v2/tests/ui_test.py
      - name: GCC journey and wizard navigation
        run: python onboarding-guide-v2/tests/gcc_ui_test.py
      - name: Team review document and service UI
        run: python onboarding-guide-v2/tests/team_review_ui_test.py
      - name: Font rendering and print navigation
        run: python onboarding-guide-v2/tests/font_render_test.py
