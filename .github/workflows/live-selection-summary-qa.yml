name: Live selection summary QA
on:
  push:
    branches: [feature/live-selection-summary]
    paths:
      - 'onboarding-guide-v2/**'
      - '.github/workflows/live-selection-summary-qa.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser runner
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Selected summary UI test
        run: python onboarding-guide-v2/tests/selection_summary_ui_test.py
      - name: Business rules
        run: node --test onboarding-guide-v2/tests/*.test.mjs
      - name: Existing wizard UI
        run: python onboarding-guide-v2/tests/single_screen_ui_test.py
