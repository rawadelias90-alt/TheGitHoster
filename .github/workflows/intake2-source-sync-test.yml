name: Intake2 source sync test

on:
  push:
    branches:
      - intake2-stage1-source-sync

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node Intake2/tests/production-rules-source-sync.test.js
      - run: node Intake2/tests/production-rules.test.js
      - run: node --check Intake2/production-rules.js
