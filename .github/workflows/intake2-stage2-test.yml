name: Intake2 Stage 2 test

on:
  push:
    branches:
      - intake2-stage2-simplified-journey

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Intake2 test suite
        run: |
          for f in Intake2/tests/*.test.js; do
            echo "Running $f"
            node "$f"
          done
      - name: Check JavaScript syntax
        run: |
          node --check Intake2/script.js
          node --check Intake2/entry-gate.js
          node --check Intake2/test-mode.js
          node --check Intake2/document-upload-pilot.js
          node --check Intake2/requirements.js
          node --check Intake2/production-rules.js
