name: Intake2 shared request ID test

on:
  push:
    branches:
      - intake2-shared-request-id

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node Intake2/tests/shared-request-title.test.js
      - run: node Intake2/tests/document-upload-pilot.test.js
      - run: node Intake2/tests/document-upload-cache.test.js
      - run: node Intake2/tests/submission-flow.test.js
      - run: node --check Intake2/entry-gate.js
      - run: node --check Intake2/document-upload-pilot.js
