name: Bootstrap Agent API Masterclass

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/agent-api-masterclass/**"

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand project files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, io, lzma, tarfile

          pieces = [path.read_text() for path in sorted(Path('.bootstrap/agent-api-masterclass').glob('*.b85'))]
          encoded = ''.join(pieces)
          archive = lzma.decompress(base64.b85decode(encoded))
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:') as tf:
              tf.extractall('.', filter='data')
          PY
          rm -rf .bootstrap
          rm -f .github/workflows/agent-api-masterclass-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add Agent API Masterclass project"
          git push origin HEAD:main
