<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AECOM UAE New Hire Guide</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .journey-item { display: block; }
    .journey-link {
      appearance: none;
      width: 100%;
      min-height: 44px;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      color: inherit;
      font: inherit;
      line-height: inherit;
      text-align: left;
      cursor: pointer;
    }
    .journey-link:hover .journey-name,
    .journey-link:focus-visible .journey-name { color: var(--ink); }
    .journey-link:hover .journey-index,
    .journey-link:focus-visible .journey-index {
      border-color: var(--green);
      background: var(--green-wash);
    }
    .journey-link:focus-visible {
      outline: 3px solid rgba(0,171,97,.22);
      outline-offset: 4px;
    }
    .detail-section,
    .gro-step,
    .intake-card,
    .summary-item { scroll-margin-top: 104px; }
    .mobile-journey ol { list-style: none; padding-left: 0; }
    .mobile-journey ol li { margin: 0; }
    .mobile-journey .journey-link {
      grid-template-columns: 1fr;
      min-height: 44px;
      padding: 8px 0;
    }
  </style>
</head>
<body class="landing-mode">
  <header class="app-header">
    <a class="brand" href="#" data-action="home" aria-label="UAE New Hire Guide home">
      <span class="brand-product">UAE New Hire Guide</span>
    </a>
    <button class="text-button" type="button" data-action="browse">Explore services</button>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <footer class="app-footer">
    Guidance tool for Talent Acquisition and Mobilisation. It does not verify documents, approvals or joining readiness.
  </footer>

  <script type="module" src="app.js"></script>
  <script>
    (() => {
      const app = document.getElementById('app');
      if (!app) return;

      const normalise = value => String(value || '')
        .toLowerCase()
        .replace(/&/g, 'and')
        .replace(/[^a-z0-9]+/g, ' ')
        .trim();

      function findHeading(label) {
        const wanted = normalise(label);
        const headings = [...app.querySelectorAll('.result-main h2, .result-main h3')];
        return headings.find(el => normalise(el.textContent) === wanted)
          || headings.find(el => {
            const text = normalise(el.textContent);
            return text && (text.startsWith(wanted) || wanted.startsWith(text));
          });
      }

      function resolveJourneyTarget(label) {
        const wanted = normalise(label);
        const heading = findHeading(label);
        if (heading) return heading.closest('.detail-section, .gro-step, .intake-card') || heading;

        if (wanted === 'intake 1') return app.querySelector('.intake-card');
        if (wanted === 'client approval') return app.querySelector('.summary-item:first-child') || app.querySelector('.detail-section');
        if (wanted === 'intake 2') return app.querySelector('.gro-section');
        if (wanted === 'pre hire readiness') return [...app.querySelectorAll('.detail-section')].find(section => normalise(section.querySelector('h2')?.textContent) === wanted);
        if (wanted.includes('gro processing')) return app.querySelector('.gro-section');
        if (wanted === 'joining' || wanted.includes('travel joining')) {
          return [...app.querySelectorAll('.detail-section')].find(section => normalise(section.querySelector('h2')?.textContent).includes('joining'));
        }
        if (wanted.includes('post joining')) {
          return [...app.querySelectorAll('.detail-section')].find(section => normalise(section.querySelector('h2')?.textContent) === 'post joining');
        }
        if (wanted.includes('completion')) return app.querySelector('.completion-section');
        if (wanted.includes('visa') || wanted.includes('work permit') || wanted.includes('medical') || wanted.includes('pension')) {
          const groSteps = [...app.querySelectorAll('.gro-step')];
          const exactStep = groSteps.find(step => {
            const title = normalise(step.querySelector('h3')?.textContent);
            return title === wanted || title.includes(wanted) || wanted.includes(title);
          });
          if (exactStep) return exactStep;
          return app.querySelector('.gro-section');
        }
        return null;
      }

      function scrollToPhase(label) {
        const target = resolveJourneyTarget(label);
        if (!target) return;
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        const focusTarget = target.matches('h2,h3') ? target : target.querySelector('h2,h3');
        if (focusTarget) {
          focusTarget.setAttribute('tabindex', '-1');
          setTimeout(() => focusTarget.focus({ preventScroll: true }), 260);
        }
      }

      function decorateJourneyItem(item) {
        if (item.dataset.journeyNavReady === 'true') return;
        const label = item.textContent.trim();
        if (!label) return;

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'journey-link';
        button.dataset.journeyScroll = label;
        button.setAttribute('aria-label', `Go to ${label}`);
        while (item.firstChild) button.appendChild(item.firstChild);
        item.appendChild(button);
        item.dataset.journeyNavReady = 'true';
      }

      function decorateJourney() {
        app.querySelectorAll('.journey-list .journey-item').forEach(decorateJourneyItem);
        app.querySelectorAll('.mobile-journey ol > li').forEach(decorateJourneyItem);
      }

      app.addEventListener('click', event => {
        const button = event.target.closest('[data-journey-scroll]');
        if (!button) return;
        scrollToPhase(button.dataset.journeyScroll);
      });

      const observer = new MutationObserver(decorateJourney);
      observer.observe(app, { childList: true, subtree: true });
      decorateJourney();
    })();
  </script>
</body>
</html>
