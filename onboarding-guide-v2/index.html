<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AECOM UAE New Hire Guide</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .journey-item { display: block; }
    .journey-link {
      appearance: none;
      width: 100%;
      min-height: 44px;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      color: inherit;
      font: inherit;
      line-height: inherit;
      text-align: left;
      cursor: pointer;
    }
    .journey-link:hover .journey-name,
    .journey-link:focus-visible .journey-name { color: var(--ink); }
    .journey-link:hover .journey-index,
    .journey-link:focus-visible .journey-index {
      border-color: var(--green);
      background: var(--green-wash);
    }
    .journey-link:focus-visible {
      outline: 3px solid rgba(0,171,97,.22);
      outline-offset: 4px;
    }
    .detail-section,
    .gro-step,
    .intake-card,
    .summary-item { scroll-margin-top: 104px; }
    .mobile-journey ol { list-style: none; padding-left: 0; }
    .mobile-journey ol li { margin: 0; }
    .mobile-journey .journey-link {
      grid-template-columns: 1fr;
      min-height: 44px;
      padding: 8px 0;
    }
  </style>
</head>
<body class="landing-mode">
  <header class="app-header">
    <a class="brand" href="#" data-action="home" aria-label="UAE New Hire Guide home">
      <span class="brand-product">UAE New Hire Guide</span>
    </a>
    <button class="text-button" type="button" data-action="browse">Explore services</button>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <footer class="app-footer">
    Guidance tool for Talent Acquisition and Mobilisation. It does not verify documents, approvals or joining readiness.
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
