<script>
(async () => {
  const replacement = document.getElementById('slide7-replacement').innerHTML;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 20000);
  try {
    const response = await fetch('./presentation-source-a706f58.html', {cache:'no-store', signal:controller.signal});
    if (!response.ok) throw new Error('Presentation source returned HTTP ' + response.status);
    const source = await response.text();
    const target = /<section\b[^>]*\bid="slide-7"[\s\S]*?<\/section>/;
    if (!target.test(source) || !source.includes('id="slide-8"') || !source.includes('id="nextBtn"')) throw new Error('The complete presentation source is unavailable.');
    const restored = source.replace(target, () => replacement);
    clearTimeout(timeout);
    document.open();
    document.write(restored);
    document.close();
  } catch (error) {
    clearTimeout(timeout);
    document.querySelector('.loading h1').textContent = 'Presentation could not load';
    document.getElementById('load-message').textContent = 'Please check your connection and try again. ' + (error.name === 'AbortError' ? 'The connection timed out.' : error.message);
    document.getElementById('retry').hidden = false;
  }
})();
</script>
