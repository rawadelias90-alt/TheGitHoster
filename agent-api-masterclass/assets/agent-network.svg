<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Agent network learning diagram</title>
  <desc id="desc">A central agent connected to tools, an MCP server, a specialist agent, a guardrail and a final output.</desc>
  <rect width="720" height="420" rx="32" fill="none"/>
  <g fill="none" stroke="#CBD5D1" stroke-width="2">
    <path d="M360 208H180" stroke-dasharray="5 7"/>
    <path d="M360 208H540" stroke-dasharray="5 7"/>
    <path d="M360 208V88"/>
    <path d="M360 208V332"/>
    <path d="M360 208L506 96"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="286" y="164" width="148" height="88" rx="22" fill="#FFFFFF" stroke="#087447" stroke-width="3"/>
      <circle cx="360" cy="190" r="12" fill="#087447"/>
      <text x="360" y="225" font-size="17" font-weight="700" fill="#111827">Agent</text>
      <text x="360" y="244" font-size="11" fill="#667085">instructions + model</text>
    </g>
    <g>
      <ellipse cx="148" cy="208" rx="76" ry="44" fill="#FFFFFF" stroke="#087E91" stroke-width="2"/>
      <text x="148" y="205" font-size="14" font-weight="700" fill="#111827">Tools</text>
      <text x="148" y="224" font-size="10" fill="#667085">web · function</text>
    </g>
    <g>
      <rect x="506" y="170" width="128" height="76" rx="18" fill="#FFFFFF" stroke="#087E91" stroke-width="2"/>
      <text x="570" y="205" font-size="14" font-weight="700" fill="#111827">MCP</text>
      <text x="570" y="224" font-size="10" fill="#667085">server tools</text>
    </g>
    <g>
      <rect x="298" y="44" width="124" height="64" rx="18" fill="#FFFFFF" stroke="#7450C0" stroke-width="2"/>
      <text x="360" y="73" font-size="13" font-weight="700" fill="#111827">Specialist</text>
      <text x="360" y="92" font-size="10" fill="#667085">handoff / tool</text>
    </g>
    <g>
      <rect x="292" y="310" width="136" height="64" rx="18" fill="#FFFFFF" stroke="#A85610" stroke-width="2"/>
      <text x="360" y="339" font-size="13" font-weight="700" fill="#111827">Guardrail</text>
      <text x="360" y="358" font-size="10" fill="#667085">validate</text>
    </g>
    <g>
      <rect x="486" y="42" width="142" height="64" rx="18" fill="#FFFFFF" stroke="#087447" stroke-width="2"/>
      <text x="557" y="71" font-size="13" font-weight="700" fill="#111827">Final output</text>
      <text x="557" y="90" font-size="10" fill="#667085">user-facing result</text>
    </g>
  </g>
</svg>
