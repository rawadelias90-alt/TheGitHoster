<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Agent learning path</title>
  <desc id="desc">Five learning stages from Learn through Build, Run, Inspect and Master.</desc>
  <rect width="900" height="260" rx="32" fill="none"/>
  <path d="M98 136H802" fill="none" stroke="#D9E0DC" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(110 136)"><circle r="34" fill="#FFFFFF" stroke="#087447" stroke-width="3"/><text y="5" font-size="15" font-weight="700" fill="#111827">01</text><text y="64" font-size="12" font-weight="700" fill="#111827">Learn</text></g>
    <g transform="translate(280 136)"><circle r="34" fill="#FFFFFF" stroke="#7450C0" stroke-width="3"/><text y="5" font-size="15" font-weight="700" fill="#111827">02</text><text y="64" font-size="12" font-weight="700" fill="#111827">Build</text></g>
    <g transform="translate(450 136)"><circle r="34" fill="#FFFFFF" stroke="#087E91" stroke-width="3"/><text y="5" font-size="15" font-weight="700" fill="#111827">03</text><text y="64" font-size="12" font-weight="700" fill="#111827">Run</text></g>
    <g transform="translate(620 136)"><circle r="34" fill="#FFFFFF" stroke="#A85610" stroke-width="3"/><text y="5" font-size="15" font-weight="700" fill="#111827">04</text><text y="64" font-size="12" font-weight="700" fill="#111827">Inspect</text></g>
    <g transform="translate(790 136)"><circle r="34" fill="#FFFFFF" stroke="#087447" stroke-width="3"/><text y="5" font-size="15" font-weight="700" fill="#111827">05</text><text y="64" font-size="12" font-weight="700" fill="#111827">Master</text></g>
  </g>
</svg>
