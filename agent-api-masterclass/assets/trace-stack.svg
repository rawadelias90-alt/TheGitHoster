    <rect x="156" y="292" width="408" height="34" rx="11" fill="#FFF7E9" stroke="#A85610"/>
    <circle cx="178" cy="309" r="5" fill="#A85610"/>
    <text x="194" y="313" font-size="11" font-weight="700" fill="#111827">Approval / guardrail decision</text>
    <path d="M108 164V326" stroke="#CBD5D1" stroke-width="2"/>
    <path d="M108 204H126M108 258H126M108 309H156" stroke="#CBD5D1" stroke-width="2"/>
