<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Trace span stack</title>
  <desc id="desc">A nested trace showing an agent span with child model, tool, approval and output spans.</desc>
  <rect width="720" height="420" rx="32" fill="none"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="66" font-size="12" font-weight="700" fill="#667085">TRACE</text>
    <rect x="70" y="86" width="580" height="266" rx="24" fill="#FFFFFF" stroke="#D9E0DC" stroke-width="2"/>
    <rect x="96" y="112" width="528" height="52" rx="14" fill="#F4F1FA" stroke="#7450C0" stroke-width="2"/>
    <circle cx="122" cy="138" r="8" fill="#7450C0"/>
    <text x="144" y="143" font-size="14" font-weight="700" fill="#111827">Agent span</text>
    <text x="550" y="143" font-size="11" fill="#667085">842 ms</text>
    <rect x="126" y="184" width="468" height="40" rx="12" fill="#FFFFFF" stroke="#CBD5D1"/>
