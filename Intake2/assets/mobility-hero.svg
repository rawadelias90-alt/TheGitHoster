<svg xmlns="http://www.w3.org/2000/svg" width="860" height="620" viewBox="0 0 860 620" fill="none">
  <style>
    .hero-desktop{display:block}
    .hero-mobile{display:none}
    @media (max-width:560px){
      .hero-desktop{display:none}
      .hero-mobile{display:block}
    }
  </style>
  <defs>
    <image id="approved-artwork" width="685" height="619" href="data:image/webp;base64,"/>
  </defs>
  <svg class="hero-desktop" x="0" y="0" width="860" height="620" viewBox="0 0 685 619" preserveAspectRatio="xMaxYMid meet">
    <use href="#approved-artwork"/>
  </svg>
  <svg class="hero-mobile" x="0" y="0" width="860" height="620" viewBox="0 0 685 619" preserveAspectRatio="xMidYMid slice">
    <use href="#approved-artwork"/>
  </svg>
</svg>