<svg xmlns="http://www.w3.org/2000/svg" width="860" height="620" viewBox="0 0 860 620" fill="none">
  <style>
    .hero-approved-desktop{display:block}
    .hero-approved-mobile{display:none}
    @media (max-width:560px){
      .hero-approved-desktop{display:none}
      .hero-approved-mobile{display:block}
    }
  </style>
  <image class="hero-approved-desktop" href="./mobility-hero-approved.webp" x="0" y="0" width="860" height="620" preserveAspectRatio="xMaxYMid meet"/>
  <image class="hero-approved-mobile" href="./mobility-hero-mobile.webp" x="0" y="0" width="860" height="620" preserveAspectRatio="xMidYMid slice"/>
</svg>
